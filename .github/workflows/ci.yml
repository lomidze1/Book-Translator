name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: book_translator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/book_translator_test
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-test-access-secret-key-min-32-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-key-min-32-chars
      CORS_ORIGIN: http://localhost:3000
      PORT: 4000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Lint API
        run: pnpm --filter @book-translator/api lint

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Lint Mobile
        run: pnpm --filter mobile lint

      - name: Typecheck Mobile
        run: cd apps/mobile && npx tsc --noEmit

      - name: Run API tests
        run: cd apps/api && npx vitest run --exclude 'test/integration/**'

      - name: Run Reader tests
        run: pnpm --filter @book-translator/reader test

      - name: Run Mobile tests
        run: pnpm --filter mobile test

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Build API
        run: pnpm --filter @book-translator/api build

      - name: Build Web
        run: pnpm --filter web build

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The API image is what Railway deploys — build it here so a broken
      # Dockerfile fails CI instead of a production deploy.
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t book-translator-api:ci .
