version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: book-translator-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-book_translator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-book_translator_pass}
      POSTGRES_DB: ${POSTGRES_DB:-book_translator}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: book-translator-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
